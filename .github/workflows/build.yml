name: Build

on:
  push:
  pull_request:

jobs:
  build:
    name: Install dependencies and verify imports
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Verify project imports cleanly
        run: python -c "import src.app, src.train, src.predict, src.data_prep, src.utils; print('All modules imported successfully')"
