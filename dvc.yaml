stages:
  prepare:
    cmd: python -m src.data_prep
    deps:
      - data/raw/Loan_default.csv
      - src/data_prep.py
      - src/utils.py
    params:
      - random_state
      - data.subsample_size
      - data.test_size
    outs:
      - data/processed/train.csv
      - data/processed/test.csv

  train:
    cmd: python -m src.train
    deps:
      - data/processed/train.csv
      - data/processed/test.csv
      - src/train.py
      - src/utils.py
    params:
      - random_state
      - training.n_trials
      - training.cv_folds
      - training.primary_metric
    outs:
      - models/model.pkl
      - reports/shap_summary.png
    metrics:
      - reports/metrics.json:
          cache: false
